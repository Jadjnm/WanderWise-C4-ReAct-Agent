<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 1000" width="1150" height="1000" style="background:#ffffff; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead Marker for Grey Lines -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <!-- Drop Shadow Filter for Clean Modern Look -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Outer Card Border -->
  <rect x="15" y="15" width="1120" height="970" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ========================================================================= -->
  <!-- HEADER: TITLE & ONE-LINE LEGEND                                          -->
  <!-- ========================================================================= -->
  <text x="575" y="55" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a" letter-spacing="-0.02em">
    C4 ReAct Agent — LangGraph State Machine Architecture
  </text>

  <!-- Legend Bar -->
  <g transform="translate(575, 86)">
    <rect x="-375" y="-14" width="750" height="28" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Solid Sample -->
    <line x1="-350" y1="0" x2="-315" y2="0" stroke="#64748b" stroke-width="2.5"/>
    <text x="-305" y="4" font-size="12" fill="#334155" font-weight="500">
      <tspan font-weight="700" fill="#0f172a">solid = always</tspan>;
    </text>
    <!-- Dashed Sample -->
    <line x1="-200" y1="0" x2="-165" y2="0" stroke="#64748b" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="-155" y="4" font-size="12" fill="#334155" font-weight="500">
      <tspan font-weight="700" fill="#0f172a">dashed = conditional edge</tspan> chosen by <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0f172a">should_continue</tspan> / <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#0f172a">should_guard_forced</tspan>
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- EDGES LAYER (Drawn underneath nodes)                                      -->
  <!-- ========================================================================= -->

  <!-- Outside Box -> START (Solid Grey Arrow) -->
  <path d="M 495 175 L 526 175" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- START -> reason (Solid Grey Arrow) -->
  <path d="M 575 205 L 575 274" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- reason -> reason (Dashed Self-Loop on open upper-right) -->
  <path d="M 710 278 C 710 215, 840 215, 840 280 C 840 316, 810 320, 804 320" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

  <!-- act -> reason (SOLID Arrow, Observation return) -->
  <path d="M 160 475 C 160 345, 250 345, 346 345" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- reason -> act (Dashed Conditional Arrow) -->
  <path d="M 350 385 C 310 385, 275 425, 275 471" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

  <!-- reason -> force_answer (Dashed Conditional Arrow) -->
  <path d="M 740 403 C 740 445, 870 445, 870 471" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

  <!-- reason -> guard (Dashed Conditional Arrow) -->
  <path d="M 575 403 L 575 661" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

  <!-- force_answer -> guard (Dashed Conditional Arrow) -->
  <path d="M 840 570 C 840 635, 737 635, 737 701" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

  <!-- guard -> END (SOLID Arrow) -->
  <path d="M 575 760 L 575 876" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- reason -> END (Dashed Conditional Arrow, routed through open left corridor) -->
  <path d="M 385 403 L 385 580 C 385 640, 260 650, 260 720 L 260 790 C 260 860, 420 907, 526 907" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

  <!-- force_answer -> END (Dashed Conditional Arrow, routed through open right corridor) -->
  <path d="M 960 570 L 960 790 C 960 860, 720 907, 624 907" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

  <!-- ========================================================================= -->
  <!-- EDGE LABELS (Pills with white backgrounds so lines never cross text)     -->
  <!-- ========================================================================= -->

  <!-- Label: reason -> reason (self-loop) -->
  <g transform="translate(775, 215)">
    <rect x="-135" y="-12" width="270" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">
      format error (no Action or Final Answer)
    </text>
  </g>

  <!-- Label: act -> reason (Observation) -->
  <g transform="translate(240, 345)">
    <rect x="-55" y="-12" width="110" height="24" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e293b">
      Observation
    </text>
  </g>

  <!-- Label: reason -> act (Action) -->
  <g transform="translate(305, 425)">
    <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">
      Action: tool(args)
    </text>
  </g>

  <!-- Label: reason -> force_answer -->
  <g transform="translate(805, 435)">
    <rect x="-105" y="-12" width="210" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">
      step limit (5), loop guards on
    </text>
  </g>

  <!-- Label: reason -> guard -->
  <g transform="translate(575, 525)">
    <rect x="-105" y="-12" width="210" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">
      Final Answer (guardrails on)
    </text>
  </g>

  <!-- Label: force_answer -> guard -->
  <g transform="translate(825, 635)">
    <rect x="-90" y="-12" width="180" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">
      answer + guardrails on
    </text>
  </g>

  <!-- Label: reason -> END -->
  <g transform="translate(260, 720)">
    <rect x="-115" y="-28" width="230" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="-10" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">
      Final Answer (guardrails off) /
    </text>
    <text x="0" y="7" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">
      LLM error /
    </text>
    <text x="0" y="23" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">
      step limit (loop guards off)
    </text>
  </g>

  <!-- Label: force_answer -> END -->
  <g transform="translate(960, 715)">
    <rect x="-45" y="-12" width="90" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">
      otherwise
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- NODES LAYER                                                               -->
  <!-- ========================================================================= -->

  <!-- BOX OUTSIDE THE GRAPH: run_react_agent() -->
  <g id="node-outside" filter="url(#shadow)">
    <rect x="45" y="130" width="450" height="90" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
    <!-- Small tag label -->
    <rect x="58" y="118" width="124" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="120" y="133" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">
      outside the graph
    </text>
    <!-- Function Title -->
    <text x="65" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="700" fill="#0f172a">
      run_react_agent()
    </text>
    <!-- Description -->
    <text x="65" y="182" font-size="12" fill="#475569">
      resolve persona (fixed or auto via route_persona) + persona version
    </text>
    <text x="65" y="202" font-size="12" fill="#475569">
      + LLM config + provider/model &rarr; initial state
    </text>
  </g>

  <!-- NODE: START (Grey Terminal Box) -->
  <g id="node-start" filter="url(#shadow)">
    <rect x="530" y="148" width="90" height="55" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="575" y="181" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="700" fill="#1e293b">
      START
    </text>
  </g>

  <!-- NODE: reason (HIGHLIGHTED, Blue Border #2f7bd8) -->
  <g id="node-reason" filter="url(#shadow)">
    <rect x="350" y="278" width="450" height="125" rx="10" fill="#e8f0fb" stroke="#2f7bd8" stroke-width="3"/>
    <!-- Node Name -->
    <text x="575" y="312" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19" font-weight="700" fill="#1d4ed8">
      reason
    </text>
    <!-- Subtitle 1 -->
    <text x="575" y="338" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">
      1 model call &rarr; parse_react_output()
    </text>
    <!-- Subtitle 2 -->
    <text x="575" y="364" text-anchor="middle" font-size="11.5" fill="#64748b">
      prompt = persona + instructions + tools + history + trace;
    </text>
    <text x="575" y="384" text-anchor="middle" font-size="11.5" fill="#64748b">
      stop at \nObservation:
    </text>
  </g>

  <!-- NODE: act -->
  <g id="node-act" filter="url(#shadow)">
    <rect x="45" y="475" width="310" height="95" rx="10" fill="#e8f0fb" stroke="#94a3b8" stroke-width="2"/>
    <!-- Node Name -->
    <text x="200" y="510" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="700" fill="#0f172a">
      act
    </text>
    <!-- Subtitle -->
    <text x="200" y="536" text-anchor="middle" font-size="12" fill="#475569">
      repeat-call block (loop guards) &rarr;
    </text>
    <text x="200" y="554" text-anchor="middle" font-size="12" fill="#475569">
      run tool &rarr; Observation
    </text>
  </g>

  <!-- NODE: force_answer (optional: loop_guards=True) -->
  <g id="node-force-answer" filter="url(#shadow)">
    <rect x="795" y="475" width="310" height="95" rx="10" fill="#e8f0fb" stroke="#94a3b8" stroke-width="2"/>
    <!-- Badge -->
    <rect x="860" y="465" width="180" height="20" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
    <text x="950" y="479" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">
      optional: loop_guards=True
    </text>
    <!-- Node Name -->
    <text x="950" y="514" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="700" fill="#0f172a">
      force_answer
    </text>
    <!-- Subtitle -->
    <text x="950" y="539" text-anchor="middle" font-size="12" fill="#475569">
      step limit: one call to answer
    </text>
    <text x="950" y="557" text-anchor="middle" font-size="12" fill="#475569">
      from observations
    </text>
  </g>

  <!-- NODE: guard (optional: guardrails=True) -->
  <g id="node-guard" filter="url(#shadow)">
    <rect x="415" y="665" width="320" height="95" rx="10" fill="#e8f0fb" stroke="#94a3b8" stroke-width="2"/>
    <!-- Badge -->
    <rect x="495" y="655" width="160" height="20" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="575" y="669" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">
      optional: guardrails=True
    </text>
    <!-- Node Name -->
    <text x="575" y="704" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="700" fill="#0f172a">
      guard
    </text>
    <!-- Subtitle -->
    <text x="575" y="730" text-anchor="middle" font-size="12" fill="#475569">
      auto-log required inquiry;
    </text>
    <text x="575" y="748" text-anchor="middle" font-size="12" fill="#475569">
      remove airfare quotes
    </text>
  </g>

  <!-- NODE: END (Grey Terminal Box) -->
  <g id="node-end" filter="url(#shadow)">
    <rect x="530" y="880" width="90" height="55" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="575" y="913" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="700" fill="#1e293b">
      END
    </text>
  </g>
</svg>